<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-label="FleetSense: every vehicle, every breakdown, decided. A truck driver reports overheating in Darija; the agents answer with a stop order, a replacement part and another truck that takes the load, avoiding an 8,000 MAD penalty.">
<title>FleetSense: every vehicle, every breakdown, decided</title>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  <radialGradient id="glow" cx="250" cy="210" r="460" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx="1060" cy="380" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ef4444" stop-opacity=".10"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  <style>
    .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .in1 { animation: up .7s ease-out .2s backwards; }
    .in2 { animation: up .7s ease-out 1.1s backwards; }
    .in3 { animation: up .7s ease-out 2.0s backwards; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .in1, .in2, .in3, .flow, .pulse { animation: none; } }
  </style>
</defs>
<rect width="1280" height="480" rx="20" fill="#0b0f14"/>
<rect width="1280" height="480" rx="20" fill="url(#grid)"/>
<rect width="1280" height="480" rx="20" fill="url(#glow)"/>
<rect width="1280" height="480" rx="20" fill="url(#glow2)"/>

<!-- brand -->
<g transform="translate(64 72)">
  <rect width="64" height="64" rx="14" fill="#121821" stroke="#1f2a37"/>
  <text x="17" y="46" class="sans" font-size="38" font-weight="700" fill="#22d3ee">F</text>
  <circle cx="45" cy="42" r="5" fill="#22d3ee"/>
  <text x="84" y="44" class="sans" font-size="40" font-weight="700" fill="#e5e7eb" letter-spacing="-1">FleetSense</text>
</g>
<text x="64" y="196" class="sans" font-size="40" font-weight="600" fill="#e5e7eb" letter-spacing="-1">Every vehicle.</text>
<text x="64" y="244" class="sans" font-size="40" font-weight="600" fill="#94a3b8" letter-spacing="-1">Every breakdown. Decided.</text>
<text x="64" y="292" class="sans" font-size="17" fill="#94a3b8">Multi-agent fleet operations for Moroccan trucks and ambulances.</text>
<text x="64" y="318" class="sans" font-size="17" fill="#94a3b8">The open model reasons. Code does the maths. A person decides.</text>

<g class="mono" font-size="13" transform="translate(64 372)">
  <rect width="150" height="34" rx="17" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".45"/>
  <text x="75" y="22" text-anchor="middle" fill="#22d3ee">DeepSeek · open</text>
  <rect x="162" width="132" height="34" rx="17" fill="none" stroke="#1f2a37"/>
  <text x="228" y="22" text-anchor="middle" fill="#94a3b8">Darija · FR</text>
  <rect x="306" width="138" height="34" rx="17" fill="none" stroke="#1f2a37"/>
  <text x="375" y="22" text-anchor="middle" fill="#94a3b8">16 vehicles</text>
</g>

<!-- driver message -->
<g class="in1" transform="translate(660 54)">
  <rect width="556" height="118" rx="16" fill="#121821" stroke="#1f2a37"/>
  <circle cx="28" cy="30" r="5" fill="#f59e0b" class="pulse"/>
  <text x="44" y="35" class="mono" font-size="12" fill="#f59e0b" letter-spacing="1">DRIVER · T-07 · A7 MOTORWAY · DARIJA</text>
  <text x="24" y="66" class="sans" font-size="16" fill="#e5e7eb">« Salam chef, lmoteur skhoun bzaf, l'aiguille wslat l7mer…</text>
  <text x="24" y="92" class="sans" font-size="16" fill="#e5e7eb">kayn sda3 bhal roulement l9eddam. Nw9ef wla nkemmel? »</text>
</g>

<!-- agent loop -->
<g class="in2" transform="translate(660 190)">
  <path d="M40 0V30" stroke="#22d3ee" stroke-width="2" class="flow"/>
  <rect x="0" y="30" width="556" height="58" rx="14" fill="#0f141c" stroke="#22d3ee" stroke-opacity=".35"/>
  <text x="24" y="54" class="mono" font-size="12" fill="#22d3ee" letter-spacing="1">MAINTENANCE AGENT · 9 TOOL CALLS</text>
  <text x="24" y="76" class="mono" font-size="12" fill="#64748b">get_vehicle → lookup_parts → compute_penalty → find_load_takeover → …</text>
  <path d="M40 88V112" stroke="#22d3ee" stroke-width="2" class="flow"/>
</g>

<!-- decision -->
<g class="in3" transform="translate(660 302)">
  <rect width="556" height="128" rx="16" fill="#121821" stroke="#ef4444" stroke-opacity=".5"/>
  <text x="24" y="34" class="mono" font-size="12" fill="#ef4444" letter-spacing="1">DECISION · 90% CONFIDENCE</text>
  <text x="24" y="64" class="sans" font-size="17" font-weight="600" fill="#e5e7eb">Stop now. Water pump failed: replace it (2,450 MAD).</text>
  <text x="24" y="92" class="sans" font-size="15" fill="#94a3b8">No spare truck within the 90-min SLA, so T-03 (37 km away,</text>
  <text x="24" y="114" class="sans" font-size="15" fill="#94a3b8">14 free pallets) takes the load. <tspan fill="#10b981" font-weight="600">8,000 MAD penalty avoided.</tspan></text>
</g>
</svg>
