<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Supplier KPI weights by urgency. Normal: price 35, delivery 20, on-time 15, warranty 15, rating 15. Urgent: price 20, delivery 40, on-time 20, warranty 10, rating 10. Critical: price 10, delivery 50, on-time 25, warranty 5, rating 10.">
<title>How the agent weighs supplier KPIs</title>
<defs><style>
  .bar { transform-box: fill-box; transform-origin: 0% 50%; animation: grow 1s cubic-bezier(.3,1.3,.5,1) backwards; }
  @keyframes grow { from { transform: scaleX(0); } }
  .fade { animation: f .6s ease-out backwards; }
  @keyframes f { from { opacity: 0; } }
  .glow { animation: gl 2.4s ease-in-out infinite; }
  @keyframes gl { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .bar, .fade, .glow { animation: none; } }
</style></defs>
<rect width="1280" height="420" rx="20" fill="#0b0f14"/>
<text x="40" y="50" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e5e7eb">The agent sets the urgency. The urgency sets the weights.</text>
<text x="40" y="76" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">score_suppliers() normalises each KPI across the suppliers that stock the part, then weights it. Same offers, different winner.</text>
<g class="fade" style="animation-delay:0.0s">
<rect x="40" y="100" width="388" height="290" rx="14" fill="#121821" stroke="#1f2a37" stroke-opacity="1"/>
