<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Diagnosis inputs: a telematics box plugged into the vehicle's OBD-II or J1939 port sends fault codes, coolant temperature, oil pressure, battery voltage, brake wear, idle time and odometer over 4G; the driver sends a message from a phone; fuel cards send fill-ups. FleetSense turns them into per-zone health and hands them to the agents.">
<title>What FleetSense diagnoses from</title>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/></pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
  <style>
    .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .flow { stroke-dasharray: 5 7; animation: dash 1.1s linear infinite; }
    .blink { animation: blink 1.4s ease-in-out infinite; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @keyframes blink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .flow, .blink { animation: none; } }
  </style>
</defs>
<rect width="1280" height="400" rx="20" fill="#0b0f14"/>
<rect width="1280" height="400" rx="20" fill="url(#grid)"/>

<!-- truck silhouette -->
<g transform="translate(40 120)">
  <rect x="0" y="0" width="190" height="110" rx="8" fill="#121821" stroke="#1f2a37"/>
  <path d="M190 30H250L285 70V110H190Z" fill="#121821" stroke="#1f2a37"/>
  <rect x="205" y="42" width="40" height="28" rx="3" fill="#0f141c" stroke="#1f2a37"/>
  <circle cx="45" cy="118" r="20" fill="#0b0f14" stroke="#64748b" stroke-width="3"/>
  <circle cx="95" cy="118" r="20" fill="#0b0f14" stroke="#64748b" stroke-width="3"/>
  <circle cx="245" cy="118" r="20" fill="#0b0f14" stroke="#64748b" stroke-width="3"/>
  <text x="95" y="50" text-anchor="middle" class="mono" font-size="12" fill="#64748b" letter-spacing="1">TRUCK · VAN</text>
  <text x="95" y="70" text-anchor="middle" class="mono" font-size="12" fill="#64748b" letter-spacing="1">AMBULANCE</text>
  <!-- port -->
  <rect x="226" y="82" width="26" height="14" rx="3" fill="#22d3ee" fill-opacity=".15" stroke="#22d3ee"/>
</g>
<text x="40" y="300" class="mono" font-size="11" fill="#64748b" letter-spacing="1">OBD-II PORT (VANS, AMBULANCES)</text>
<text x="40" y="318" class="mono" font-size="11" fill="#64748b" letter-spacing="1">J1939 / FMS CAN BUS (TRUCKS)</text>

<!-- dongle -->
<path d="M292 209C320 209 320 150 348 150" stroke="#22d3ee" stroke-width="1.6" fill="none" class="flow"/>
<g transform="translate(350 100)">
  <rect width="190" height="100" rx="14" fill="#0f141c" stroke="#22d3ee" stroke-opacity=".8"/>
  <circle cx="22" cy="24" r="5" fill="#10b981" class="blink"/>
  <text x="36" y="29" class="mono" font-size="12" fill="#22d3ee" letter-spacing="1">TELEMATICS BOX</text>
  <text x="18" y="56" class="sans" font-size="13" fill="#94a3b8">Off-the-shelf GPS + CAN</text>
  <text x="18" y="75" class="sans" font-size="13" fill="#94a3b8">tracker, plugged in the</text>
  <text x="18" y="94" class="sans" font-size="13" fill="#94a3b8">port, 4G uplink</text>
</g>

<!-- signals -->
<g transform="translate(580 40)">
  <text x="0" y="0" class="mono" font-size="11" fill="#64748b" letter-spacing="2">SIGNALS READ</text>
  <g class="mono" font-size="12">
    <rect y="14" width="300" height="230" rx="12" fill="#121821" stroke="#1f2a37"/>
    <text x="18" y="44" fill="#e5e7eb">dtc</text><text x="160" y="44" fill="#94a3b8">P0217, P0562, C0040</text>
    <text x="18" y="72" fill="#e5e7eb">coolant_c</text><text x="160" y="72" fill="#94a3b8">fail &gt; 105 °C</text>
    <text x="18" y="100" fill="#e5e7eb">oil_bar</text><text x="160" y="100" fill="#94a3b8">fail &lt; 1.5 bar</text>
    <text x="18" y="128" fill="#e5e7eb">battery_v</text><text x="160" y="128" fill="#94a3b8">fail &lt; 12.0 V</text>
    <text x="18" y="156" fill="#e5e7eb">brake_wear_pct</text><text x="160" y="156" fill="#94a3b8">fail &gt; 85 %</text>
    <text x="18" y="184" fill="#e5e7eb">idle_pct_7d</text><text x="160" y="184" fill="#94a3b8">warn &gt; 25 %</text>
    <text x="18" y="212" fill="#e5e7eb">km · speed · GPS</text><text x="160" y="212" fill="#94a3b8">life, ETAs, routes</text>
    <text x="18" y="236" fill="#64748b" font-size="10.5">+ fuel-card fill-ups (litres, odometer, city)</text>
  </g>
</g>
<path d="M540 150H576" stroke="#22d3ee" stroke-width="1.6" fill="none" marker-end="url(#arr)" class="flow"/>

<!-- phone -->
<g transform="translate(350 236)">
  <rect width="190" height="104" rx="14" fill="#121821" stroke="#f59e0b" stroke-opacity=".6"/>
  <text x="18" y="28" class="mono" font-size="12" fill="#f59e0b" letter-spacing="1">DRIVER'S PHONE</text>
  <text x="18" y="54" class="sans" font-size="13" fill="#94a3b8">What the sensors can't</text>
  <text x="18" y="73" class="sans" font-size="13" fill="#94a3b8">say: smell, smoke, noise.</text>
  <text x="18" y="92" class="sans" font-size="13" fill="#94a3b8">Darija or French text</text>
</g>
<path d="M540 288C560 288 560 230 576 230" stroke="#f59e0b" stroke-width="1.6" fill="none" class="flow"/>

<!-- out -->
<path d="M880 160H938" stroke="#22d3ee" stroke-width="1.6" fill="none" marker-end="url(#arr)" class="flow"/>
<g transform="translate(940 70)">
  <rect width="300" height="190" rx="14" fill="#0f141c" stroke="#ef4444" stroke-opacity=".6"/>
  <text x="20" y="32" class="mono" font-size="12" fill="#ef4444" letter-spacing="1">PER-ZONE HEALTH → AGENTS</text>
  <g class="sans" font-size="13">
    <circle cx="26" cy="60" r="5" fill="#ef4444"/><text x="40" y="65" fill="#e5e7eb">Cooling · coolant 118 °C · P0217</text>
    <circle cx="26" cy="88" r="5" fill="#10b981"/><text x="40" y="93" fill="#94a3b8">Electrical · 14.1 V</text>
    <circle cx="26" cy="116" r="5" fill="#10b981"/><text x="40" y="121" fill="#94a3b8">Brakes · wear 50 %</text>
    <circle cx="26" cy="144" r="5" fill="#10b981"/><text x="40" y="149" fill="#94a3b8">Engine · oil 3.8 bar</text>
  </g>
  <text x="20" y="176" class="sans" font-size="12" fill="#64748b">Colours the 3D part · starts the agent loop</text>
</g>
<text x="1090" y="296" text-anchor="middle" class="sans" font-size="12" fill="#64748b">Hackathon build: the scenario runner</text>
<text x="1090" y="314" text-anchor="middle" class="sans" font-size="12" fill="#64748b">injects this telemetry; same schema</text>
</svg>
