<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Roadmap. Live: four agents on DeepSeek-V3, Darija and French reports, suppliers, SLA and takeover, 3D twin and live map. Next: self-hosted DeepSeek, real telematics boxes, fuel-card and TMS connectors, driver app. Later: Darija voice notes, learning from mechanic outcomes, failure prediction, evaluation on unseen breakdowns.">
<title>FleetSense roadmap</title>
<defs><style>
  .in { animation: in .7s cubic-bezier(.3,1.3,.5,1) backwards; }
  @keyframes in { from { opacity: 0; transform: translateY(16px); } }
  .road { stroke-dasharray: 14 12; animation: road 1s linear infinite; }
  @keyframes road { to { stroke-dashoffset: -26; } }
  .truck { animation: drive 9s ease-in-out infinite; }
  @keyframes drive { 0% { transform: translateX(0); } 45%,55% { transform: translateX(560px); } 100% { transform: translateX(1080px); } }
  @media (prefers-reduced-motion: reduce) { .in, .road, .truck { animation: none; } }
</style></defs>
<rect width="1280" height="360" rx="20" fill="#0b0f14"/>
<rect x="40" y="300" width="1200" height="30" rx="15" fill="#121821"/>
<line x1="56" y1="315" x2="1224" y2="315" stroke="#64748b" stroke-width="2" class="road"/>
<g class="truck"><g transform="translate(60 296)">
  <rect x="0" y="4" width="54" height="22" rx="3" fill="#e5e7eb"/><path d="M54 10H70L78 18V26H54Z" fill="#22d3ee"/>
  <circle cx="14" cy="28" r="5" fill="#0b0f14" stroke="#94a3b8" stroke-width="2"/><circle cx="66" cy="28" r="5" fill="#0b0f14" stroke="#94a3b8" stroke-width="2"/>
</g></g>
